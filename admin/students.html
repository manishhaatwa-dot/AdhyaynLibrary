<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students - Adhyayn Library</title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         GLOBAL CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- =====================================================
         STUDENTS CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/students.css"
    >

</head>


<body>


<div class="app-container">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <div
        id="sidebar-container"
    ></div>


    <div class="main-content">


        <!-- =================================================
             NAVBAR
             ================================================= -->

        <div
            id="navbar-container"
        ></div>


        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="content-body">


            <!-- =================================================
                 PAGE HEADER
                 ================================================= -->

            <div class="students-header">


                <div class="header-titles">

                    <h1>
                        Student Directory
                    </h1>


                    <p>
                        Manage registered students for the current
                        library branch.
                    </p>

                </div>


                <!-- =================================================
                     ADD STUDENT
                     ================================================= -->

                <button
                    class="add-student-trigger"
                    id="open-add-modal-btn"
                    type="button"
                >
                    + Add Student
                </button>


            </div>


            <!-- =================================================
                 SEARCH
                 ================================================= -->

            <div
                class="search-filter-panel glass"
            >

                <div class="search-box">

                    <input
                        type="text"
                        id="student-search-input"
                        placeholder="Search by Name, Login Code, Seat or Class..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- =================================================
                 STUDENT TABLE
                 ================================================= -->

            <div
                class="students-table-card glass"
            >

                <div
                    class="table-scroll-container"
                >

                    <table
                        class="students-data-table"
                    >

                        <thead>

                            <tr>

                                <th>
                                    Unique Login Code
                                </th>


                                <th>
                                    Seat No
                                </th>


                                <th>
                                    Student Name
                                </th>


                                <th>
                                    Email
                                </th>


                                <th>
                                    Class
                                </th>


                                <th>
                                    Joining Date
                                </th>


                                <th>
                                    Fee Due Date
                                </th>


                                <th>
                                    Mobile
                                </th>


                                <th>
                                    Fee Status
                                </th>


                                <th>
                                    Shift
                                </th>


                                <th class="actions-header">
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="students-table-rows"
                        >

                            <tr>

                                <td
                                    colspan="11"
                                    class="table-empty"
                                    style="
                                        text-align:center;
                                        padding:2rem;
                                    "
                                >
                                    Loading student records...
                                </td>

                            </tr>

                        </tbody>


                    </table>

                </div>

            </div>


        </main>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div
            id="footer-container"
        ></div>


    </div>


</div>


<!-- =========================================================
     STUDENT ADD / EDIT MODAL
     ========================================================= -->

<div
    class="modal-overlay"
    id="student-modal"
    aria-hidden="true"
>


    <div
        class="modal-window glass"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title-context"
    >


        <!-- =================================================
             MODAL HEADER
             ================================================= -->

        <div class="modal-header">

            <div>

                <h2 id="modal-title-context">
                    Register New Library Member
                </h2>

            </div>


            <button
                class="close-modal-btn"
                id="close-modal-btn"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- =================================================
             GENERATED STUDENT CODE
             ================================================= -->

        <div
            id="modal-code-display-block"
            class="hide-element modal-code-box"
        >

            <span>
                Student Login Code
            </span>


            <strong
                id="modal-student-code-preview"
            ></strong>

        </div>


        <!-- =================================================
             STUDENT FORM
             ================================================= -->

        <form
            id="student-form"
            class="modal-form"
            autocomplete="off"
        >


            <!-- =================================================
                 INTERNAL EDIT INFORMATION
                 ================================================= -->

            <input
                type="hidden"
                id="form-edit-index"
                value=""
            >


            <input
                type="hidden"
                id="form-student-code"
                value=""
            >


            <div class="form-grid">


                <!-- =================================================
                     STUDENT NAME
                     ================================================= -->

                <div class="form-group">

                    <label for="std-name">
                        Student Name
                    </label>


                    <input
                        type="text"
                        id="std-name"
                        placeholder="Enter student name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- =================================================
                     STUDENT EMAIL
                     ================================================= -->

                <div class="form-group">

                    <label for="std-email">
                        Student Email
                    </label>


                    <input
                        type="email"
                        id="std-email"
                        placeholder="Enter student email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- =================================================
                     CLASS
                     ================================================= -->

                <div class="form-group">

                    <label for="std-class">
                        Class
                    </label>


                    <input
                        type="text"
                        id="std-class"
                        placeholder="Enter class"
                        required
                    >

                </div>


                <!-- =================================================
                     SEAT NUMBER
                     ================================================= -->

                <div class="form-group">

                    <label for="std-seat">
                        Seat Number
                    </label>


                    <input
                        type="text"
                        id="std-seat"
                        placeholder="Enter seat number"
                        required
                    >

                </div>


                <!-- =================================================
                     MOBILE NUMBER
                     ================================================= -->

                <div class="form-group">

                    <label for="std-mobile">
                        Mobile Number
                    </label>


                    <input
                        type="tel"
                        id="std-mobile"
                        placeholder="Enter mobile number"
                        inputmode="numeric"
                        maxlength="10"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- =================================================
                     SHIFT
                     ================================================= -->

                <div class="form-group">

                    <label for="std-shift">
                        Shift
                    </label>


                    <select
                        id="std-shift"
                        required
                    >

                        <option value="">
                            Select Shift
                        </option>


                        <option value="Morning">
                            Morning
                        </option>


                        <option value="Afternoon">
                            Afternoon
                        </option>


                        <option value="Evening">
                            Evening
                        </option>


                        <option value="Full Day">
                            Full Day
                        </option>

                    </select>

                </div>


                <!-- =================================================
                     JOINING DATE
                     ================================================= -->

                <div class="form-group">

                    <label for="std-joining">
                        Joining Date
                    </label>


                    <input
                        type="text"
                        id="std-joining"
                        placeholder="DD/MM/YYYY"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>


                <!-- =================================================
                     FEE DUE DATE
                     ================================================= -->

                <div class="form-group">

                    <label for="std-fee-due-date">
                        Fee Due Date
                    </label>


                    <input
                        type="text"
                        id="std-fee-due-date"
                        placeholder="DD/MM/YYYY"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="off"
                        required
                    >

                </div>


            </div>


            <!-- =================================================
                 FORM ACTIONS
                 ================================================= -->

            <div class="form-actions">


                <button
                    id="cancel-form-btn"
                    type="button"
                    class="secondary-btn"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Student
                </button>


            </div>


        </form>


    </div>

</div>


<!-- =========================================================
     FIREBASE SDK
     ========================================================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>


<!-- =========================================================
     SHARED CORE
     ========================================================= -->

<script src="../js/dashboard.js"></script>


<!-- =========================================================
     STUDENT DIRECTORY LOGIC
     ========================================================= -->

<script src="../js/students.js"></script>


</body>

</html>
