<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Student History - Adhyayn Library</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- GLOBAL CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- STUDENT HISTORY CSS -->

    <style>

        .history-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 1rem;

            margin-bottom: 1.5rem;

        }


        .history-title h1 {

            margin: 0 0 0.35rem;

            font-size: 1.6rem;

            color: var(--text-main);

        }


        .history-title p {

            margin: 0;

            color: var(--text-muted);

            font-size: 0.9rem;

        }


        .history-search-panel {

            padding: 1rem;

            margin-bottom: 1.5rem;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: var(--radius-md);

            box-shadow: var(--shadow-sm);

        }


        .history-search {

            width: 100%;

            max-width: 500px;

            min-height: 44px;

            padding: 0.7rem 0.9rem;

            border: 1px solid #cbd5e1;

            border-radius: var(--radius-sm);

            outline: none;

            font-family: inherit;

            font-size: 0.9rem;

        }


        .history-search:focus {

            border-color: var(--primary-color);

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);

        }


        .history-card {

            padding: 1rem;

            background: #ffffff;

            border: 1px solid #edf2f7;

            border-radius: var(--radius-md);

            box-shadow: var(--shadow-md);

            overflow: hidden;

        }


        .history-scroll {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

        }


        .history-table {

            width: 100%;

            min-width: 850px;

            border-collapse: collapse;

            text-align: left;

            font-size: 0.85rem;

        }


        .history-table th {

            padding: 1rem 0.75rem;

            background: #f8fafc;

            color: #475569;

            font-weight: 700;

            border-bottom: 2px solid #e2e8f0;

            white-space: nowrap;

        }


        .history-table td {

            padding: 0.9rem 0.75rem;

            border-bottom: 1px solid #f1f5f9;

            color: var(--text-main);

            vertical-align: middle;

        }


        .history-table tbody tr:hover {

            background: #f8fafc;

        }


        .history-empty {

            text-align: center;

            color: #94a3b8;

            padding: 2rem !important;

        }


        .history-status {

            display: inline-block;

            padding: 0.2rem 0.55rem;

            border-radius: 5px;

            font-size: 0.72rem;

            font-weight: 700;

        }


        .history-status.active {

            background: #ecfdf5;

            color: #059669;

        }


        .history-status.expired {

            background: #fef2f2;

            color: #dc2626;

        }


        @media (max-width: 700px) {

            .history-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .history-search {

                max-width: 100%;

            }


            .history-card {

                padding: 0.75rem;

            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- SIDEBAR -->

    <div
        id="sidebar-container"
    ></div>


    <div class="main-content">


        <!-- NAVBAR -->

        <div
            id="navbar-container"
        ></div>


        <main class="content-body">


            <!-- HEADER -->

            <div class="history-header">

                <div class="history-title">

                    <h1>
                        Students History
                    </h1>

                    <p>
                        View previous and current student records
                        for this library.
                    </p>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="history-search-panel">

                <input
                    type="text"
                    id="history-search-input"
                    class="history-search"
                    placeholder="Search by student name, code, seat or mobile..."
                    autocomplete="off"
                >

            </div>


            <!-- TABLE -->

            <div class="history-card">

                <div class="history-scroll">

                    <table class="history-table">

                        <thead>

                            <tr>

                                <th>
                                    Student Code
                                </th>

                                <th>
                                    Student Name
                                </th>

                                <th>
                                    Father's Name
                                </th>

                                <th>
                                    Seat No
                                </th>

                                <th>
                                    Class
                                </th>

                                <th>
                                    Joining Date
                                </th>

                                <th>
                                    Expiry Date
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    History Date
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="student-history-rows"
                        >

                            <tr>

                                <td
                                    colspan="9"
                                    class="history-empty"
                                >
                                    Loading student history...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


        </main>


        <!-- FOOTER -->

        <div
            id="footer-container"
        ></div>


    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- SHARED CORE -->

<script src="../js/dashboard.js"></script>


<!-- STUDENT HISTORY -->

<script src="../js/student-history.js"></script>


</body>

</html>
