<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students History - Adhyayn Library</title>


    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         GLOBAL CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Inter, sans-serif;
        }


        .history-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 22px;

        }


        .history-header h1 {

            margin: 0 0 6px;

        }


        .history-header p {

            margin: 0;

            color: #64748b;

            font-size: 0.88rem;

        }


        .history-search-panel {

            margin-bottom: 18px;

        }


        .history-search {

            width: 100%;

            min-height: 45px;

            padding: 11px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            font: inherit;

        }


        .history-search:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);

        }


        .history-table-card {

            overflow: hidden;

        }


        .history-table-scroll {

            overflow-x: auto;

        }


        .history-table {

            width: 100%;

            min-width: 1000px;

            border-collapse: collapse;

        }


        .history-table th,
        .history-table td {

            padding: 13px 14px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;

            white-space: nowrap;

        }


        .history-table th {

            background: #f8fafc;

            color: #475569;

            font-size: 0.78rem;

            font-weight: 700;

        }


        .history-table td {

            color: #334155;

            font-size: 0.84rem;

        }


        .history-code {

            font-weight: 800;

            color: #2563eb;

        }


        .history-name {

            font-weight: 700;

            color: #111827;

        }


        .history-status {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 999px;

            background: #f1f5f9;

            color: #475569;

            font-size: 0.72rem;

            font-weight: 700;

        }


        .history-empty {

            text-align: center;

            padding: 40px 20px;

            color: #64748b;

        }


        .history-view-btn {

            border: none;

            border-radius: 7px;

            padding: 7px 11px;

            background: #eff6ff;

            color: #2563eb;

            font: inherit;

            font-size: 0.76rem;

            font-weight: 700;

            cursor: pointer;

        }


        .history-view-btn:hover {

            background: #dbeafe;

        }


        .history-back-btn {

            border: none;

            border-radius: 8px;

            padding: 10px 14px;

            background: #f1f5f9;

            color: #334155;

            font: inherit;

            font-weight: 700;

            cursor: pointer;

        }


        .history-modal {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(15, 23, 42, 0.55);

        }


        .history-modal.active {

            display: flex;

        }


        .history-modal-box {

            width: 100%;

            max-width: 560px;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 16px;

            padding: 24px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.20);

        }


        .history-modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

        }


        .history-modal-header h2 {

            margin: 0;

            font-size: 1.2rem;

        }


        .history-close {

            border: none;

            background: transparent;

            font-size: 25px;

            cursor: pointer;

            color: #64748b;

        }


        .history-details {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

        }


        .history-detail {

            padding: 12px;

            border-radius: 9px;

            background: #f8fafc;

        }


        .history-detail span {

            display: block;

            margin-bottom: 4px;

            color: #64748b;

            font-size: 0.72rem;

        }


        .history-detail strong {

            display: block;

            color: #111827;

            font-size: 0.84rem;

            word-break: break-word;

        }


        @media (max-width: 650px) {

            .history-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .history-details {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <div
        id="sidebar-container"
    ></div>


    <div class="main-content">


        <!-- =================================================
             NAVBAR
             ================================================= -->

        <div
            id="navbar-container"
        ></div>


        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="content-body">


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <div class="history-header">

                <div>

                    <h1>
                        Students History
                    </h1>

                    <p>
                        View records of students who have
                        left the library or were removed.
                    </p>

                </div>


                <button
                    type="button"
                    class="history-back-btn"
                    onclick="window.location.href='admin-dashboard.html'"
                >
                    Back to Dashboard
                </button>

            </div>


            <!-- =================================================
                 SEARCH
                 ================================================= -->

            <div
                class="panel-card history-search-panel"
            >

                <input
                    type="text"
                    id="history-search-input"
                    class="history-search"
                    placeholder="Search by Student Name, Login Code, Seat, Class or Mobile..."
                    autocomplete="off"
                >

            </div>


            <!-- =================================================
                 HISTORY TABLE
                 ================================================= -->

            <div
                class="panel-card history-table-card"
            >

                <div class="history-table-scroll">

                    <table class="history-table">

                        <thead>

                            <tr>

                                <th>
                                    Login Code
                                </th>

                                <th>
                                    Student Name
                                </th>

                                <th>
                                    Father's Name
                                </th>

                                <th>
                                    Seat
                                </th>

                                <th>
                                    Class
                                </th>

                                <th>
                                    Joining Date
                                </th>

                                <th>
                                    Expiry Date
                                </th>

                                <th>
                                    Deleted Date
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Details
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="student-history-rows"
                        >

                            <tr>

                                <td
                                    colspan="10"
                                    class="history-empty"
                                >
                                    Loading student history...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


        </main>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div
            id="footer-container"
        ></div>


    </div>

</div>


<!-- =========================================================
     DETAILS MODAL
     ========================================================= -->

<div
    id="history-details-modal"
    class="history-modal"
    aria-hidden="true"
>

    <div class="history-modal-box">

        <div class="history-modal-header">

            <h2>
                Student History Details
            </h2>


            <button
                type="button"
                id="history-close-modal"
                class="history-close"
            >
                ×
            </button>

        </div>


        <div
            id="history-details-content"
            class="history-details"
        ></div>

    </div>

</div>


<!-- =========================================================
     FIREBASE SDK
     ========================================================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- =========================================================
     SHARED CORE
     ========================================================= -->

<script src="../js/dashboard.js"></script>


<!-- =========================================================
     STUDENT HISTORY LOGIC
     ========================================================= -->

<script src="../js/students-history.js"></script>


</body>

</html>
