<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Adhyayn Library - Admin Login</title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         GLOBAL CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================================================
     LOGIN PAGE
     ========================================================= -->

<div class="login-page">


    <div class="login-card">


        <!-- =================================================
             BRAND
             ================================================= -->

        <div class="login-brand">

            <div class="brand-name">

                <h1>
                    Adhyayn Library
                </h1>

                <p>
                    Admin Portal
                </p>

            </div>

        </div>


        <!-- =================================================
             LOGIN TITLE
             ================================================= -->

        <div class="login-header">

            <h2>
                Admin Login
            </h2>

            <p>
                Sign in to manage your library
            </p>

        </div>


        <!-- =================================================
             ADMIN LOGIN FORM
             ================================================= -->

        <form
            id="admin-login-form"
        >


            <!-- =================================================
                 ADMIN EMAIL
                 ================================================= -->

            <div class="form-group">

                <label
                    for="admin-email"
                >
                    Admin Email
                </label>


                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label
                    for="admin-password"
                >
                    Password
                </label>


                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- =================================================
                 LOGIN MESSAGE
                 ================================================= -->

            <div
                id="login-message"
                class="login-message"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 LOGIN BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="login-button"
            >
                Admin Login
            </button>


            <!-- =================================================
                 FORGOT PASSWORD
                 ================================================= -->

            <a
                href="#"
                id="forgot-password-btn"
                class="forgot-password"
            >
                Forgot Password?
            </a>


        </form>


        <!-- =================================================
             DEVELOPMENT INFORMATION
             ================================================= -->

        <div
            class="login-development-info"
        >

            Demo Admin

            <br>

            Email:
            demo@adhyayn.com

            <br>

            Password:
            Demo@12345

        </div>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="login-footer">

            Adhyayn Library Admin Portal

        </div>


    </div>


</div>


<!-- =========================================================
     FIREBASE SDK
     ========================================================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>


<!-- =========================================================
     SHARED ADMIN CORE
     ========================================================= -->

<script src="js/dashboard.js"></script>


</body>

</html>
